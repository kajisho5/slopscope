<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>slopscope social A</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;width:1280px;height:640px;overflow:hidden;position:relative;background:#0E0E10;color:#F4F4F5;font-family:"Inter","Noto Sans CJK JP",sans-serif;
       background-image:radial-gradient(#26262B 1px,transparent 1px);background-size:32px 32px;background-position:16px 16px}
  .left{position:absolute;left:80px;top:72px;width:620px}

  .spec{position:absolute;left:720px;top:120px;width:420px;height:300px;border-radius:18px;padding:36px;

  .spec .tiny{position:absolute;right:28px;top:26px;width:16px;height:16px;border:1px solid #DDD6FE;border-radius:3px}
  svg.ann{position:absolute;inset:0}
  .lab{position:absolute;font-family:"DejaVu Sans Mono",monospace;font-size:15px;color:#F4F4F5;white-space:nowrap}
  .lab i{font-style:normal;color:#FF5A36;margin-right:8px}
  .foot{position:absolute;left:80px;bottom:56px;font-family:"DejaVu Sans Mono",monospace;font-size:15px;color:#71717A}
