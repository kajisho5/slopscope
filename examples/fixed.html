<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimbuzz — fictional fixed landing page</title>
<!-- The same fictional page with each slopscope finding fixed. -->
<style>
  :root{color-scheme:light dark;--bg:#fff;--ink:#18181b;--muted:#5f5f68;--accent:#1d4ed8;--line:#d4d4d8}
  @media (prefers-color-scheme:dark){:root{--bg:#18181b;--ink:#f4f4f5;--muted:#a1a1aa;--accent:#93b4ff;--line:#3f3f46}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .hero{padding:48px 24px;border-bottom:1px solid var(--line)}
  .hero h1{font-size:36px;margin:0 0 12px}
  .muted{color:var(--muted)}
  .cta{background:var(--ink);color:var(--bg);border:0;padding:12px 20px;border-radius:8px;min-height:44px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .wide{max-width:100%;padding:8px;border:1px solid var(--line)}
  .field{font-size:16px;padding:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
  .icon{width:44px;height:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  @media (prefers-reduced-motion:no-preference){.cta:hover{transition:background .15s}}
</style>
</head>
<body>
  <section class="hero">
    <h1>Release notes your team reads</h1>
    <p class="muted">Nimbuzz turns merged pull requests into a weekly summary.</p>
    <button class="cta" type="button">Start a trial</button>
  </section>
  <main style="padding:24px">
    <p class="muted">Used by the fictional teams in this example.</p>
    <p><a href="#pricing">Pricing</a></p>
    <div class="wide">This strip fits the screen.</div>
    <p><label>Email <input class="field" type="email" placeholder="you@example.invalid"></label></p>
    <p><button class="icon" type="button" aria-label="Close"><svg width="12" height="12" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor"/></svg></button></p>
  </main>
</body>
</html>
